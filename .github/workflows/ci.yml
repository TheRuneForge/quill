name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify immutable workflow action pins
        run: node tools/verify-action-pins.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm ci
        working-directory: app
      - run: npm run validate
        working-directory: app
      - run: sh tools/deploy.sh cloudflare.example.env --dry-run
      - run: node --test tools/*.test.mjs
      - run: node tools/check-addresses.mjs

  kontakter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kontakter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install -r requirements-dev.txt requests pypdf dnspython playwright
      - run: python -m pytest -q
