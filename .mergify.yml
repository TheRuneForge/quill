# GitHub's native merge queue remains authoritative for main.
# Mergify's merge queue is intentionally not configured here: the active
# GitHub merge_queue ruleset blocks Mergify merges unless that ruleset is
# deliberately migrated. Keep one queue responsible for merging.

merge_protections:
  - name: Quill CI
    description: Require both application and contact validation before merge.
    if:
      - base = main
    success_conditions:
      - check-success = app
      - check-success = kontakter

merge_protections_settings:
  post_comment: true
  reporting_method: check-runs
  # auto_merge_conditions is intentionally omitted.
  # GitHub's native merge queue owns the merge decision.

pull_request_rules:
  - name: label Renovate dependency updates
    conditions:
      - base = main
      - author = renovate[bot]
    actions:
      label:
        add:
          - dependencies

  - name: label Dependabot dependency updates
    conditions:
      - base = main
      - author = dependabot[bot]
    actions:
      label:
        add:
          - dependencies

  - name: label security updates
    conditions:
      - base = main
      - title ~= "(?i)(security|CVE|vulnerability|dependabot alert)"
    actions:
      label:
        add:
          - security
