# GitHub's native merge queue remains authoritative on main.
# Mergify auto-merge is enabled for PRs that satisfy these protections.
# The repository ruleset must be migrated to Mergify's queue before this
# configuration can merge automatically.

merge_protections:
  - name: Quill CI
    description: Require both application and contact validation before merge.
    if:
      - base = main
    success_conditions:
      - check-success = app
      - check-success = kontakter

merge_protections_settings:
  auto_merge_conditions: true
  post_comment: true
  reporting_method: check-runs

queue_rules:
  - name: main
    merge_method: squash
    queue_conditions:
      - base = main
    merge_conditions:
      - check-success = app
      - check-success = kontakter

pull_request_rules:
  - name: label Renovate dependency updates
    conditions:
      - base = main
      - author = renovate[bot]
    actions:
      label:
        add:
          - dependencies

  - name: label Dependabot dependency updates
    conditions:
      - base = main
      - author = dependabot[bot]
    actions:
      label:
        add:
          - dependencies

  - name: label security updates
    conditions:
      - base = main
      - title ~= "(?i)(security|CVE|vulnerability|dependabot alert)"
    actions:
      label:
        add:
          - security
